version: "1.0"
agent_id: "agente-financeiro-destino"

budget_limits:
  max_transaction_value: 200.00
  currency: "BRL"
  # ─── Agregação (fix T7) ───
  aggregation_window_seconds: 60
  max_aggregate_per_target: 200.00
  on_aggregate_exceeded: "deny"

security_controls:
  on_prompt_injection_or_override: "deny"

rules:
  - tool: "executar_pagamento"
    action: "allow"
    max_amount: 200.00
  - tool: "executar_pagamento"
    action: "require_approval_for"
    min_amount: 200.01
  - tool: "executar_comando_sistema"
    action: "deny"